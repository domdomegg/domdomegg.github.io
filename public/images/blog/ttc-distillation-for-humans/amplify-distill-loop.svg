<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .node { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .nodelabel { fill: #2563eb; }
    .branch { stroke: #d97706; stroke-width: 2; fill: none; }
    .leaf { fill: #d97706; }
    .loop { stroke: #78716c; stroke-width: 2; fill: none; }
    .loophead { fill: #78716c; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .node { fill: #1e293b; stroke: #60a5fa; }
      .nodelabel { fill: #60a5fa; }
      .loop { stroke: #a8a29e; }
      .loophead { fill: #a8a29e; }
    }
  </style>

  <!-- Fast intuition -->
  <circle cx="140" cy="130" r="40" class="node"/>
  <text x="140" y="135" text-anchor="middle" font-size="13" font-weight="600" class="nodelabel">intuition</text>

  <!-- Deep search: a little tree -->
  <g class="branch">
    <line x1="430" y1="95" x2="400" y2="130"/>
    <line x1="430" y1="95" x2="430" y2="132"/>
    <line x1="430" y1="95" x2="460" y2="130"/>
    <line x1="400" y1="130" x2="386" y2="163"/>
    <line x1="400" y1="130" x2="412" y2="163"/>
    <line x1="430" y1="132" x2="430" y2="163"/>
    <line x1="460" y1="130" x2="448" y2="163"/>
    <line x1="460" y1="130" x2="474" y2="163"/>
  </g>
  <g class="leaf">
    <circle cx="430" cy="95" r="6"/>
    <circle cx="400" cy="130" r="5"/><circle cx="430" cy="132" r="5"/><circle cx="460" cy="130" r="5"/>
    <circle cx="386" cy="163" r="4"/><circle cx="412" cy="163" r="4"/><circle cx="430" cy="163" r="4"/>
    <circle cx="448" cy="163" r="4"/><circle cx="474" cy="163" r="4"/>
  </g>
  <text x="430" y="196" text-anchor="middle" font-size="13" font-weight="600" class="ink">tree search</text>

  <!-- Amplify: intuition feeds effortful search -->
  <path class="loop" d="M 180 100 C 240 55 350 52 408 78"/>
  <path class="loophead" d="M 404 68 L 417 83 L 398 82 Z"/>
  <text x="290" y="42" text-anchor="middle" font-size="13" class="muted">amplify: spend more effort</text>

  <!-- Distil: search results train the intuition -->
  <path class="loop" d="M 390 185 C 330 226 230 226 176 178"/>
  <path class="loophead" d="M 172 190 L 168 171 L 186 178 Z"/>
  <text x="285" y="245" text-anchor="middle" font-size="13" class="muted">distill: practise until it's instinct</text>
</svg>
