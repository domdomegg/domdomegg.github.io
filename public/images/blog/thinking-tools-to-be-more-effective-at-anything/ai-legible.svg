<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .node { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.5; }
    .litnode { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .spark { fill: #2563eb; }
    .cone { fill: #2563eb; opacity: 0.1; }
    .tline { stroke: #a8a29e; stroke-width: 2; stroke-linecap: round; }
    .btline { stroke: #60a5fa; stroke-width: 2; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .node { fill: #292524; stroke: #a8a29e; }
      .litnode { fill: #1e293b; stroke: #60a5fa; }
      .spark { fill: #3b82f6; }
      .cone { fill: #60a5fa; opacity: 0.14; }
      .tline { stroke: #78716c; }
    }
  </style>

  <defs>
