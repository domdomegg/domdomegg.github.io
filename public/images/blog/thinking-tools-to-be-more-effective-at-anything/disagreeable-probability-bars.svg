<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 235" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .ontime { fill: #2563eb; }
    .late { fill: #d97706; }
    .verylate { fill: #78716c; }
    .seglabel { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .shift { stroke: #78716c; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.6; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .ontime { fill: #3b82f6; }
      .verylate { fill: #57534e; }
      .shift { stroke: #a8a29e; }
    }
  </style>

  <text x="60" y="46" font-size="12.5" class="muted">today</text>
  <g>
    <rect x="60" y="55" width="368" height="34" rx="4" class="ontime"/>
    <rect x="430" y="55" width="69" height="34" rx="4" class="late"/>
    <rect x="501" y="55" width="23" height="34" rx="4" class="verylate"/>
  </g>
  <text x="244" y="77" text-anchor="middle" class="seglabel">80%</text>
  <text x="464" y="77" text-anchor="middle" class="seglabel">15%</text>
  <text x="530" y="77" font-size="12.5" class="muted">5%</text>

  <line x1="428" y1="91" x2="336" y2="133" class="shift"/>
  <line x1="499" y1="91" x2="476" y2="133" class="shift"/>

  <text x="60" y="126" font-size="12.5" class="muted">after bad news about a subcomponent</text>
  <g>
    <rect x="60" y="135" width="276" height="34" rx="4" class="ontime"/>
    <rect x="338" y="135" width="138" height="34" rx="4" class="late"/>
    <rect x="478" y="135" width="46" height="34" rx="4" class="verylate"/>
  </g>
  <text x="198" y="157" text-anchor="middle" class="seglabel">60%</text>
  <text x="407" y="157" text-anchor="middle" class="seglabel">30%</text>
  <text x="501" y="157" text-anchor="middle" class="seglabel">10%</text>

  <g>
    <circle cx="66" cy="205" r="5" class="ontime"/>
    <text x="76" y="209" font-size="12.5" class="ink">delivered on time</text>
    <circle cx="216" cy="205" r="5" class="late"/>
    <text x="226" y="209" font-size="12.5" class="ink">up to a week late</text>
    <circle cx="366" cy="205" r="5" class="verylate"/>
    <text x="376" y="209" font-size="12.5" class="ink">more than a week late</text>
  </g>
</svg>
