<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .branch { stroke: #2563eb; stroke-width: 2; fill: none; }
    .node { fill: #2563eb; }
    .cut { stroke: #78716c; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; opacity: 0.65; }
    .cutnode { fill: #78716c; opacity: 0.65; }
    .keep { stroke: #2563eb; stroke-width: 3.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .branch { stroke: #3b82f6; }
      .node { fill: #3b82f6; }
      .cut { stroke: #a8a29e; }
      .cutnode { fill: #a8a29e; }
      .keep { stroke: #60a5fa; }
    }
  </style>

  <text x="140" y="26" text-anchor="middle" font-size="14" font-weight="600" class="ink">First: branch freely</text>
  <text x="420" y="26" text-anchor="middle" font-size="14" font-weight="600" class="ink">Then: prune to one path</text>

  <!-- Left tree: root at (140,220), 6 leaves -->
  <g class="branch">
    <path d="M 140 220 C 100 180 70 140 55 70"/>
    <path d="M 140 220 C 115 175 100 130 92 65"/>
    <path d="M 140 220 C 135 170 132 120 130 62"/>
    <path d="M 140 220 C 155 170 165 120 172 65"/>
    <path d="M 140 220 C 175 180 200 140 212 72"/>
    <path d="M 140 220 C 190 190 230 160 248 92"/>
  </g>
  <g class="node">
    <circle cx="55" cy="70" r="5"/><circle cx="92" cy="65" r="5"/><circle cx="130" cy="62" r="5"/>
    <circle cx="172" cy="65" r="5"/><circle cx="212" cy="72" r="5"/><circle cx="248" cy="92" r="5"/>
    <circle cx="140" cy="220" r="6"/>
  </g>

  <!-- Right tree: same shape, all pruned except one bold path -->
  <g class="cut">
    <path d="M 420 220 C 380 180 350 140 335 70"/>
    <path d="M 420 220 C 395 175 380 130 372 65"/>
    <path d="M 420 220 C 435 170 445 120 452 65"/>
    <path d="M 420 220 C 455 180 480 140 492 72"/>
    <path d="M 420 220 C 470 190 510 160 528 92"/>
  </g>
  <g class="cutnode">
    <circle cx="335" cy="70" r="5"/><circle cx="372" cy="65" r="5"/>
    <circle cx="452" cy="65" r="5"/><circle cx="492" cy="72" r="5"/><circle cx="528" cy="92" r="5"/>
  </g>
  <path class="keep" d="M 420 220 C 415 170 412 120 410 62"/>
  <circle cx="410" cy="62" r="7" class="node"/>
  <circle cx="420" cy="220" r="6" class="node"/>

  <text x="280" y="248" text-anchor="middle" font-size="13" class="muted">doing both at once does both badly</text>
</svg>
