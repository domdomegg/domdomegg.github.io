<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .loop { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .loophead { fill: #2563eb; }
    .step { stroke: #78716c; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .loop { stroke: #3b82f6; }
      .loophead { fill: #3b82f6; }
      .step { stroke: #a8a29e; }
    }
  </style>

  <defs>
    <marker id="ch" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="loophead"/>
    </marker>
  </defs>

  <!-- Three cycles, growing: r=26, 44, 68; open arcs with arrowheads -->
  <path class="loop" d="M 96 104 A 26 26 0 1 1 96 156" marker-end="url(#ch)"/>
  <path class="loop" d="M 240 92 A 44 44 0 1 1 240 180" marker-end="url(#ch)"/>
  <path class="loop" d="M 432 68 A 68 68 0 1 1 432 204" marker-end="url(#ch)"/>

  <!-- Connectors -->
  <line x1="128" y1="130" x2="176" y2="132" class="step"/>
  <line x1="300" y1="134" x2="344" y2="136" class="step"/>

  <!-- Labels: ship -> learn cadence, batch size grows -->
  <g font-size="13" text-anchor="middle" class="ink">
    <text x="96" y="135" font-weight="600">v0.1</text>
    <text x="240" y="141" font-weight="600">v1</text>
    <text x="432" y="141" font-weight="600">v10</text>
  </g>
  <g font-size="12.5" text-anchor="middle" class="muted">
    <text x="103" y="205">2 users</text>
    <text x="252" y="220">20 users</text>
    <text x="443" y="242">everyone</text>
  </g>

  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="600" class="ink">Each loop: ship &#8594; learn why it's wrong &#8594; grow the batch</text>
</svg>
