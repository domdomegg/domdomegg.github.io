<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .rail { stroke: #78716c; stroke-width: 3; stroke-linecap: round; }
    .rung { stroke: #78716c; stroke-width: 2.5; stroke-linecap: round; }
    .best { fill: #2563eb; }
    .infoline { stroke: #2563eb; stroke-width: 2; fill: none; }
    .infohead { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .rail { stroke: #a8a29e; }
      .rung { stroke: #a8a29e; }
      .best { fill: #60a5fa; }
      .infoline { stroke: #3b82f6; }
      .infohead { fill: #3b82f6; }
    }
  </style>

  <defs>
    <marker id="ih" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="infohead"/>
    </marker>
  </defs>

  <!-- Ladder rails -->
  <line x1="70" y1="25" x2="70" y2="300" class="rail"/>
  <line x1="140" y1="25" x2="140" y2="300" class="rail"/>

  <!-- Rungs + labels, best at top -->
  <g font-size="14">
    <line x1="70" y1="50" x2="140" y2="50" class="rung"/>
    <text x="160" y="55" class="best" font-weight="600">Be a user</text>

    <line x1="70" y1="110" x2="140" y2="110" class="rung"/>
    <text x="160" y="115" class="ink">Talk to users, with good questions</text>

    <line x1="70" y1="170" x2="140" y2="170" class="rung"/>
    <text x="160" y="175" class="ink">Role-play as a user</text>

    <line x1="70" y1="230" x2="140" y2="230" class="rung"/>
    <text x="160" y="235" class="muted">Imagine what they want</text>

    <line x1="70" y1="290" x2="140" y2="290" class="rung"/>
    <text x="160" y="295" class="muted">Don't think about them at all</text>
  </g>

  <!-- Information arrow, pointing up -->
  <line x1="510" y1="280" x2="510" y2="60" class="infoline" marker-end="url(#ih)"/>
  <text x="532" y="175" font-size="13" class="muted" transform="rotate(-90 532 175)" text-anchor="middle">information</text>
</svg>
