<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .slowloop { stroke: #78716c; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .slowhead { fill: #78716c; }
    .fastloop { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .fasthead { fill: #2563eb; }
    .node { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.5; }
    .fastnode { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .fasttext { fill: #1e3a8a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .slowloop { stroke: #a8a29e; }
      .slowhead { fill: #a8a29e; }
      .fastloop { stroke: #3b82f6; }
      .fasthead { fill: #3b82f6; }
      .node { fill: #292524; stroke: #a8a29e; }
      .fastnode { fill: #1e293b; stroke: #60a5fa; }
      .fasttext { fill: #bfdbfe; }
    }
  </style>

  <defs>
    <marker id="sh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="slowhead"/>
    </marker>
    <marker id="fh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="fasthead"/>
    </marker>
  </defs>

  <!-- LEFT: no loop / slow loop -->
  <text x="140" y="26" text-anchor="middle" font-size="13.5" font-weight="600" class="ink">No loop: guessing</text>

  <rect x="60" y="48" width="160" height="34" rx="7" class="node"/>
  <text x="140" y="70" text-anchor="middle" font-size="12.5" class="ink">do a lot of work</text>

  <path class="slowloop" marker-end="url(#sh)" d="M 140 84 L 140 118"/>

  <rect x="60" y="122" width="160" height="34" rx="7" class="node"/>
  <text x="140" y="144" text-anchor="middle" font-size="12.5" class="ink">ship it, eventually</text>

  <path class="slowloop" marker-end="url(#sh)" d="M 140 158 L 140 192"/>

  <rect x="60" y="196" width="160" height="46" rx="7" class="node"/>
  <text x="140" y="214" text-anchor="middle" font-size="12.5" class="muted">find out it was wrong</text>
  <text x="140" y="231" text-anchor="middle" font-size="12.5" class="muted">(months later)</text>

  <text x="140" y="268" text-anchor="middle" font-size="12" class="muted">one slow, expensive lesson</text>

  <!-- RIGHT: tight loop -->
  <text x="410" y="26" text-anchor="middle" font-size="13.5" font-weight="600" class="fasttext">A loop: hillclimbing</text>

  <!-- circular loop with 3 nodes -->
  <g class="fastloop" marker-end="url(#fh)">
    <path d="M 448 78 Q 492 118 470 168"/>
    <path d="M 430 196 Q 380 214 336 186"/>
    <path d="M 330 154 Q 320 100 366 72"/>
  </g>

  <rect x="352" y="48" width="116" height="32" rx="7" class="fastnode"/>
  <text x="410" y="69" text-anchor="middle" font-size="12" class="fasttext">try something</text>

  <rect x="418" y="166" width="112" height="32" rx="7" class="fastnode"/>
  <text x="474" y="187" text-anchor="middle" font-size="12" class="fasttext">see the result</text>

  <rect x="288" y="166" width="112" height="32" rx="7" class="fastnode"/>
  <text x="344" y="187" text-anchor="middle" font-size="12" class="fasttext">adjust</text>

  <text x="410" y="268" text-anchor="middle" font-size="12" class="muted">many cheap lessons, compounding</text>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" class="ink">The loop matters more than any single attempt within it.</text>
</svg>
