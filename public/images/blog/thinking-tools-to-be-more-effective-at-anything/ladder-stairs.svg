<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .ink { fill: #44403c; }
    .muted { fill: #78716c; }
    .step { stroke: #78716c; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
    .best { fill: #2563eb; }
    .loss { stroke: #d97706; stroke-width: 2; fill: none; }
    .losshead { fill: #d97706; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #d6d3d1; }
      .muted { fill: #a8a29e; }
      .step { stroke: #a8a29e; }
      .best { fill: #60a5fa; }
      .loss { stroke: #d97706; }
      .losshead { fill: #d97706; }
    }
  </style>

  <defs>
    <marker id="lh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="losshead"/>
    </marker>
  </defs>

  <!-- Descending staircase, left (high) to right (low) -->
  <path class="step" d="M 20 60 L 124 60 L 124 105 L 228 105 L 228 150 L 332 150 L 332 195 L 436 195 L 436 240 L 540 240"/>

  <g font-size="12.5" text-anchor="middle">
    <text x="72" y="45" class="best" font-weight="600">Be a user</text>
    <text x="176" y="90" class="ink">Talk to users</text>
    <text x="280" y="135" class="ink">Role-play as one</text>
    <text x="384" y="180" class="muted">Imagine their wants</text>
    <text x="488" y="225" class="muted">Don't think of them</text>
  </g>

  <!-- Information-loss arrow in the empty space below the staircase -->
  <line x1="45" y1="135" x2="320" y2="258" class="loss" marker-end="url(#lh)" stroke-dasharray="6 5"/>
  <text x="30" y="283" font-size="13" class="muted">each rung down loses information</text>
</svg>
